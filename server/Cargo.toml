[package]
name = "fury-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Only for StreamExt on the upload body: a bundle is streamed to disk rather
# than buffered, because axum's default 2 MB body limit is smaller than any
# real profile and buffering the alternative is worse.
futures-util = { version = "0.3", default-features = false }
fury-shared = { path = "../shared-rs" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
time.workspace = true
sha2.workspace = true
rand.workspace = true
base64 = "0.22"

axum = "0.8"
# Email for confirming an invited address (mail.rs). rustls with ring, the
# same TLS the database connection uses, so the static release binary does
# not pick up OpenSSL.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1-rustls-tls",
] }
argon2 = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "time",
    "json",
    "macros",
    "migrate",
] }

[dev-dependencies]
# In-process requests for recovery_tests.rs: the router without a socket.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
