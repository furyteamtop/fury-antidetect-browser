# Copyright 2026 Bogdan Shapovalov and the Fury authors
#
# What can honestly be checked on a hosted runner.
#
# NOT the browser. A Chromium checkout is ~38 GB and the first build takes about
# six hours on 16 GB of RAM; GitHub's hosted runners have 14 GB of disk and a
# six-hour job limit, so a core build would fail on both counts. The patch
# series, the detect-suite and every Rust and TypeScript crate are checkable in
# minutes, and pretending to check more than that would produce a green tick
# that means nothing.
#
# The browser is checked by core/verify/ on a machine that has one — see
# self-hosted.yml, which is the same steps for a runner with the tree already
# synced.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Two jobs rather than one, and the split is the point rather than a
  # workaround.
  #
  # The first run of this workflow — the first ever, because there was no remote
  # until publication — failed here:
  #
  #     error: failed to run custom build command for `gobject-sys v0.18.0`
  #     The system library `gobject-2.0` was not found.
  #
  # fury-desktop is Tauri, and on Linux Tauri is GTK and WebKitGTK. On macOS it
  # is WKWebView and on Windows it is WebView2, so that dependency exists on
  # exactly the platform this project does not ship. Installing a GTK stack on
  # the runner would have made the red tick go away and would have tested the
  # shell against a toolkit it will never run on.
  #
  # So: the shell is tested where it ships, and everything else is tested on
  # Linux — which also keeps honest the claim in platform-rs/src/dirs.rs that
  # the Rust still compiles there for contributors, since an untested claim is
  # the thing this repository is supposed to be against.

  rust:
    name: cargo test (everything but the shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --exclude fury-desktop, not --exclude tauri: the crate is what pulls
      # GTK, and naming the crate says which platform decision is behind it.
      - run: cargo test --workspace --exclude fury-desktop --all-targets
      - name: cargo build --release
        run: cargo build --release --workspace --exclude fury-desktop

  shell-rust:
    name: cargo test (the shell, on macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The sidecar has to exist before the shell's Rust will compile at all.
      # tauri.conf.json declares externalBin: ["binaries/fury-agent"], and
      # tauri-build resolves that to binaries/fury-agent-<target-triple> in its
      # build script. desktop/src-tauri/binaries/ is gitignored — a 7 MB binary
      # per platform has no business in the history — so a fresh checkout does
      # not have one and the build script stops with
      #
      #     resource path `binaries/fury-agent-aarch64-apple-darwin` doesn't exist
      #
      # scripts/sidecar.mjs builds the agent and puts it there under the right
      # name, which is the same script a release uses.
      #
      # This was invisible until the first CI run, and it is the oldest bug
      # there is: the developer's machine had one left over from an earlier
      # build, so the crate compiled locally and could not compile anywhere
      # else. Reproduced by moving the directory aside and watching it fail
      # with the same message — the first guess was the frontend, and moving
      # dist/ aside disproved that before it reached a commit.
      - run: node desktop/scripts/sidecar.mjs

      # The whole workspace, so this is also the job that proves the agent and
      # the server build on the platform that is actually released.
      - run: cargo test --workspace --all-targets

  windows-surface:
    name: the Windows code compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      # The port's riskiest code — named pipes, security descriptors, handle
      # inheritance, six unsafe FFI calls — lives in one crate precisely so this
      # job can exist. `cargo check -p fury-agent --target
      # x86_64-pc-windows-msvc` does NOT work: ring's build script wants a
      # Windows C toolchain and ring arrives through both sqlx and reqwest, so
      # without the split this would all be written blind and first compiled on
      # a rented Windows machine at an hourly rate.
      #
      # It has already earned this. Three mistakes were caught here rather than
      # there: OpenProcessToken imported from Win32::Security instead of
      # Win32::System::Threading, create_with_security_attributes_ptr for
      # create_with_security_attributes_raw, and a BOOL alias windows-sys 0.61
      # no longer has.
      #
      # What it proves: signatures, argument counts, pointer mutability, feature
      # gates. What it does NOT prove: that a DACL denies what it should, that a
      # handle survives CreateProcess, that a pipe is not squatted. Those need a
      # running Windows — tools/verify-windows.ps1.
      - name: the Windows surface type-checks
        run: cargo check -p fury-platform --target x86_64-pc-windows-msvc --all-targets

      # Windows PowerShell 5.1 -- what `powershell.exe` still is on Windows 11 --
      # reads a .ps1 as Windows-1252 unless the file carries a UTF-8 BOM. Every
      # non-ASCII character then arrives as mojibake, and one inside a string
      # ends the string early. Measured 15.08.2026 on the first Windows run:
      # verify-windows.ps1 was UTF-8 with em dashes in its comments and would not
      # PARSE, reporting "Unexpected token 'see'" and five more errors on lines
      # whose only fault was punctuation. The script had never been run.
      #
      # A BOM would also fix it and is not what this checks, because a BOM is
      # invisible and one editor saving without it puts the bug back silently.
      # ASCII cannot be lost by accident, and this is two lines.
      - name: PowerShell scripts are ASCII
        run: |
          if LC_ALL=C grep -n -P '[^\x00-\x7F]' $(git ls-files '*.ps1'); then
            echo "!! non-ASCII above: Windows PowerShell 5.1 reads .ps1 as Windows-1252 and will fail to parse" >&2
            exit 1
          fi
          echo "ok: $(git ls-files '*.ps1' | wc -l) PowerShell scripts, all ASCII"

      # The check above is worth exactly as much as the crate is thin. A
      # dependency with a build script needing a C toolchain silently makes it
      # impossible again, so the failure is here, next to the reason.
      - name: nothing heavy crept into the platform crate
        run: |
          set -euo pipefail
          deps=$(cargo tree -p fury-platform --target x86_64-pc-windows-msvc \
                 --prefix none --no-dedupe | awk '{print $1}' | sort -u)
          for banned in ring aws-lc-sys openssl-sys libsqlite3-sys; do
            if grep -qx "$banned" <<<"$deps"; then
              echo "!! $banned is in fury-platform's dependency graph."
              echo "   It needs a Windows C toolchain, so the cross-check above"
              echo "   stops working on a developer's Mac and the Windows code"
              echo "   goes back to being written blind."
              echo "   See platform-rs/Cargo.toml."
              exit 1
            fi
          done
          echo "fury-platform is still checkable from a Mac"

  desktop:
    name: shell typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json
        working-directory: desktop
      - run: npm run build
        working-directory: desktop

  series:
    name: the patch series holds together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-commit-identity.py reads every commit. The default depth-1
          # checkout would give it one to read and it would pass on anything.
          fetch-depth: 0

      # Every entry in the series has a file, and every file is in the series.
      # A listed-but-missing patch makes apply.sh fail hours into a build; a
      # present-but-unlisted one is silently never applied, which is worse
      # because the vector looks covered.
      - name: series and files agree
        run: |
          set -euo pipefail
          listed=$(grep -v '^#' core/patches/series | grep -v '^$' \
                   | sed 's/#.*//' | tr -d ' ' | sed 's/!$//' | sort)
          for p in $listed; do
            test -f "core/patches/$p" || { echo "!! listed, not written: $p"; exit 1; }
          done
          for f in core/patches/*.patch; do
            n=$(basename "$f")
            echo "$listed" | grep -qx "$n" || { echo "!! written, not listed: $n"; exit 1; }
          done
          echo "$(echo "$listed" | wc -w) patches, all accounted for"

      # A hunk header whose line counts do not match its body applies as
      # garbage or not at all. This has happened here twice, both times by
      # hand-editing a patch to reorder the series.
      # A dependency added to the workspace root has to reach the manifest a
      # server is built with, or the next deployment fails inside cargo with a
      # message about inheritance that names no file anybody edited.
      - name: the deploy workspace manifest matches the repository's
        run: python3 tools/ci/gen-deploy-workspace.py --check

      # Where this is published is written down in eleven places, one of which
      # is the auto-updater's endpoint. Nine said one thing and two said
      # another before the first push; nothing would have failed loudly.
      - name: every URL names the same repository
        run: python3 tools/ci/check-repo-url.py

      # An unconfigured git builds an author address out of the account name
      # and the hostname and commits with it without a word. It happened twice,
      # in the two commits before publication, because .git/config is local and
      # a history rewrite replaced the directory it lived in.
      #
      # Needs the full history, which actions/checkout does not fetch by
      # default — a depth-1 checkout would check exactly one commit and pass.
      - name: no commit carries a machine-derived identity
        run: python3 tools/ci/check-commit-identity.py

      # Six tools over newline-delimited JSON-RPC. The check that earns its
      # place is the one about notifications: answering a message with no id
      # leaves a client waiting for a reply it can never match.
      - name: the MCP server speaks the protocol
        run: python3 tools/mcp/fury-mcp.py --selftest

      - name: hunk headers count correctly
        run: python3 tools/ci/check-hunks.py

      # A patch that re-creates a file an earlier patch creates breaks the
      # series on a clean tree while looking perfectly plausible in review.
      - name: no patch re-creates another patch's file
        run: python3 tools/ci/check-duplicate-creates.py

  captures:
    name: no capture carries a real address
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # status.py footers the commit that last touched the baselines —
          # `git log -1 -- baselines/...` — so the reader can see when the
          # measurement was taken rather than when the page was generated. A
          # depth-1 checkout has no such commit to find, the footer comes out
          # empty, and --check reports the page as out of date on a page that
          # is perfectly current.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A capture is taken by running a browser on somebody's real machine, so
      # this recurs on every measurement anybody ever takes. The .gitignore
      # holds until somebody types `git add -f`.
      - run: cargo run -p fury-detect -- redact --check
      # The ServiceWorker payload is generated from the Worker's. If they drift,
      # a capture reports a cross-context disagreement that belongs to the
      # harness rather than to the browser — the one false positive the headline
      # number cannot afford.
      - run: python3 tools/detect-suite/sync-sw.py --check
      # The status page is generated from those same captures. Regenerating it
      # here keeps a published page from claiming numbers the repository no
      # longer contains — the one way a status page is worse than none.
      - run: python3 tools/detect-suite/status.py --check

  rls:
    name: row-level security actually refuses
    runs-on: ubuntu-latest
    # The one job here that needs a database, because the thing under test is
    # not Rust — it is whether PostgreSQL refuses a query. Every mock of this
    # would have passed throughout the period the policies did nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A NON-superuser role owning the database, which is what
      # deploy/server-install.sh creates and the only arrangement these tests
      # mean anything in.
      #
      # The first version let the image create POSTGRES_USER=fury, and the
      # image makes that role a superuser. A superuser bypasses row security
      # outright — measured: as `postgres`, an unbound connection saw all three
      # projects; as `fury`, it saw none — so every RLS test would have run
      # against a database where the policies did not apply. They would have
      # failed rather than passed silently, which is the better direction, but a
      # security job that cannot run is not a security job.
      - name: a role that the policies actually apply to
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE fury LOGIN PASSWORD 'fury';"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE fury OWNER fury;"
          psql -h 127.0.0.1 -U postgres -tAc \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'fury'" \
            | grep -qx f || { echo "!! fury can bypass row security — the tests would prove nothing"; exit 1; }

      - run: cargo test -p fury-server
        env:
          DATABASE_URL: postgres://fury:fury@127.0.0.1:5432/fury
          # For the one assertion that needs to read past the policies: an audit
          # row orphaned by a deleted organisation is invisible to every
          # application user by design, so only a superuser can confirm it
          # survived.
          DATABASE_SUPERUSER_URL: postgres://postgres:postgres@127.0.0.1:5432/fury

  licensing:
    name: every file says what it is
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX headers
        run: |
          set -euo pipefail
          missing=0
          for f in $(git ls-files '*.rs' '*.ts' '*.tsx' '*.py' '*.sh' \
                     | grep -v '^core/patches/'); do
            head -5 "$f" | grep -q 'SPDX-License-Identifier' || {
              echo "!! no SPDX header: $f"; missing=1; }
          done
          exit $missing
      - name: the licences exist
        run: test -f LICENSE && test -f NOTICE && test -f core/patches/LICENSE
