#
# A ready fury-server for every release, so a team server is installed rather
# than compiled.
#
# Both install paths built from source: deploy/server-install.sh ran cargo on
# the VPS and docker-compose.yml compiled inside a container. On the small
# machines people rent for this, that is anything from several minutes to half
# an hour, and a tester's whole report of setting up his server was "something
# compiled for a long time" (08.10.2026).
#
# On a published release this builds a static binary per architecture (musl,
# so it runs on any distribution), attaches it to the release with its
# checksum, and publishes a container image built from those same binaries to
# ghcr.io/<owner>/fury-server. The installer and the compose file use them and
# fall back to building only when they are not there.
#
# workflow_dispatch exists for a release made before this file, or one whose
# run failed: pass the tag.

name: server release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.21"
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  binary:
    name: fury-server ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustup target add ${{ matrix.arch }}-unknown-linux-musl

      # ring compiles C, and musl-gcc is what links it statically.
      - name: build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p fury-server --target ${{ matrix.arch }}-unknown-linux-musl

      # The binary that gets published is the one that ran here: it answers
      # with the release's own version and has no dynamic dependencies.
      - name: check
        run: |
          BIN=target/${{ matrix.arch }}-unknown-linux-musl/release/fury-server
          file "$BIN"
          # x86_64 musl links static-pie, which `file` words differently.
          file "$BIN" | grep -qE "statically linked|static-pie linked" || { echo "not static"; exit 1; }
          got="$("$BIN" --version)"
          echo "$got"
          [ "$got" = "fury-server ${TAG#v}" ] || { echo "version mismatch: $got vs ${TAG#v}"; exit 1; }

      - name: package
        run: |
          VER="${TAG#v}"
          NAME="fury-server-$VER-linux-${{ matrix.arch }}"
          tar -czf "$NAME.tar.gz" -C target/${{ matrix.arch }}-unknown-linux-musl/release fury-server
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          mkdir -p image-bin
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/fury-server "image-bin/fury-server-${{ matrix.arch }}"

      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" fury-server-*-linux-${{ matrix.arch }}.tar.gz fury-server-*-linux-${{ matrix.arch }}.tar.gz.sha256 --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: image-bin/

  image:
    name: container image
    needs: binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: image-bin
          merge-multiple: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: tags
        id: tags
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "list=ghcr.io/$OWNER/fury-server:${TAG#v},ghcr.io/$OWNER/fury-server:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Fury team server
            org.opencontainers.image.licenses=AGPL-3.0-or-later
