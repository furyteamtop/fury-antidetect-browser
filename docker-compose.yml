# One command to a working team server.
#
#   cp .env.example .env   # set FURY_DB_PASSWORD
#   docker compose up -d
#
# The server comes as a ready image, built and checked for each release
# (.github/workflows/server-release.yml), so this takes as long as a download.
# FURY_VERSION in .env pins a release; without it, the newest. To compile it
# here instead, from the checkout you are in:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The server is deliberately dumb: it never generates a fingerprint, never
# decrypts a profile, and never proxies browser traffic. That is why a 1 vCPU
# box carries a team — and why compromising it yields metadata, not accounts.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fury
      POSTGRES_PASSWORD: ${FURY_DB_PASSWORD:?set FURY_DB_PASSWORD in .env}
      POSTGRES_DB: fury
    volumes:
      - fury-db:/var/lib/postgresql/data
    healthcheck:
      # The server applies migrations on boot, so it must not start against a
      # database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U fury -d fury"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    image: ghcr.io/furyteamtop/fury-server:${FURY_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fury:${FURY_DB_PASSWORD}@db:5432/fury
      BIND: 0.0.0.0:8901
    # Bound to loopback on purpose: put a reverse proxy in front for TLS.
    # Session tokens over plain HTTP on a public interface would be a gift.
    ports:
      - "127.0.0.1:8901:8901"
    # The profiles themselves. Without a volume they lived in the container and
    # went with it at the first rebuild, leaving a database that lists versions
    # whose bytes are gone. Back this up together with fury-db (docs/14).
    volumes:
      - fury-bundles:/var/lib/fury/bundles

volumes:
  fury-db:
  fury-bundles:
