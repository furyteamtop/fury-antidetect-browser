# Self-hosted Fury backend.
#
# The server stores ciphertext and metadata; it cannot decrypt a profile bundle.
# That is what makes it safe to run on the cheapest VPS you have.
#
#   cp .env.example .env   # set POSTGRES_PASSWORD and MINIO_ROOT_PASSWORD
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fury
      POSTGRES_USER: fury
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fury -d fury"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the server needs to reach it.
    expose:
      - "5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fury}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Agents fetch bundles from presigned URLs, so this must be reachable by
      # clients. Put it behind TLS in any real deployment.
      - "9000:9000"
      - "127.0.0.1:9001:9001"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fury:${POSTGRES_PASSWORD}@postgres/fury
      BIND: 0.0.0.0:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: fury-bundles
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-fury}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Public base URL used when signing bundle URLs handed to agents.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
