[package]
name = "fury-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fury-shared = { path = "../shared-rs" }
# Named pipes, DACLs and the config carrier. Its own crate so that
# `cargo check --target x86_64-pc-windows-msvc` runs on a Mac, which it cannot
# do for this one — see platform-rs/src/lib.rs.
fury-platform = { path = "../platform-rs" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
sha2.workspace = true
rand.workspace = true
time.workspace = true
# The same SQL stack as the server, not a second one: rusqlite and sqlx both
# link the native sqlite3 library, and cargo allows only one package in a graph
# to do that. Sharing sqlx also means the local schema and the server schema are
# written against the same tooling.
# Only for checking that a proxy works: one request through the operator's own
# upstream to a geo service. `socks` because a SOCKS5 exit is the common case
# and reqwest does not speak it by default.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "charset",
    "http2",
    "socks",
] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "sqlite",
    "uuid",
    "time",
    "json",
    "macros",
] }
tar = "0.4"
flate2 = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
keyring = "4"
# Userspace WireGuard. `wg-quick` routes the whole machine, which is the
# opposite of what a per-profile tunnel needs, and neither macOS nor Windows
# gives an unprivileged process its own route — so the tunnel lives here.
#
# It pulls `ring`, which is fine in THIS crate: sqlx and reqwest already do.
# It must never reach platform-rs, which stays thin so the Windows target can
# be cross-checked from a Mac (see platform-rs/src/lib.rs).
#
# 0.7 rather than 0.6, and not for a feature: 0.6 pins
# `x25519-dalek = "=2.0.0-rc.3"`, a release candidate, while shared-rs uses the
# stable 2.x. Both are semver-compatible so cargo unifies them and the
# resolution fails outright. 0.7 dropped the pin.
boringtun = { version = "0.7", default-features = false }
# The TCP stack that runs inside the tunnel. There is no borrowing the
# operating system's: the kernel's stack is bound to the kernel's interfaces,
# and the point of a userspace tunnel is that there is no interface.
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
] }
base64 = "0.22"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake", "connect"] }
futures-util = { version = "0.3.33", default-features = false, features = ["sink"] }

