[package]
name = "fury-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fury-shared = { path = "../shared-rs" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
sha2.workspace = true
rand.workspace = true
time.workspace = true
# The same SQL stack as the server, not a second one: rusqlite and sqlx both
# link the native sqlite3 library, and cargo allows only one package in a graph
# to do that. Sharing sqlx also means the local schema and the server schema are
# written against the same tooling.
# Only for checking that a proxy works: one request through the operator's own
# upstream to a geo service. `socks` because a SOCKS5 exit is the common case
# and reqwest does not speak it by default.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "charset",
    "http2",
    "socks",
] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "sqlite",
    "uuid",
    "time",
    "json",
    "macros",
] }
tar = "0.4"
flate2 = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
keyring = "4"
base64 = "0.22"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake", "connect"] }
futures-util = { version = "0.3.33", default-features = false, features = ["sink"] }

[target.'cfg(unix)'.dependencies]
# dup2 only. std has no equivalent, and the config descriptor has to land on 3.
libc = "0.2"
