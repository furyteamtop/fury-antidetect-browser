[package]
name = "fury-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fury desktop shell"
# keyring 4 requires a newer compiler than the rest of the workspace. Stated
# here rather than raised workspace-wide: the agent and server should stay
# buildable on older toolchains, and only this crate needs the newer one.
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fury-shared = { path = "../../shared-rs" }

tauri = { version = "2", features = [] }
# Two copies of the shell would each keep a profile lock alive and each show a
# stale view of the other's work. See the comment in main.rs.
tauri-plugin-single-instance = "2"

# rustls for one TLS implementation across macOS and Windows — one set of
# failures to explain instead of two.
#
# The roots must come from the OS, not from webpki-roots. `rustls-tls` alone
# resolves to `rustls-tls-webpki-roots`, which compiles in Mozilla's list and
# ignores the platform trust store entirely — so an admin who installs their
# organisation's internal CA into the System keychain would still get a TLS
# failure, reported by set_server as "nothing answered". Internal CAs are the
# normal case for a self-hosted product, not the exception.
#
# default-features = false also drops charset, http2 and system-proxy, so they
# are named explicitly. system-proxy is what makes the app work behind a
# corporate proxy configured in System Settings rather than in the environment.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "charset",
    "http2",
    "system-proxy",
] }

anyhow.workspace = true
thiserror.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
keyring = "4"
whoami = "1"
