# GENERATED by tools/ci/gen-deploy-workspace.py — do not edit.
#
# The workspace manifest a server is built with. Only two crates travel, so the
# member list is not the repository's; everything else is copied from it
# verbatim, because a hand-maintained copy drifts and the drift only shows up
# as a failed deployment.
#
# Regenerate after changing [workspace.dependencies] in the root Cargo.toml:
#     python3 tools/ci/gen-deploy-workspace.py

[workspace]
resolver = "2"
members = [
    "server",
    "shared-rs",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-or-later"
repository = "https://github.com/fury-browser/fury"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
digest = "0.10"
rand = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
