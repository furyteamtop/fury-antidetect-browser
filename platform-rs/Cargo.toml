[package]
name = "fury-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The parts of Fury that differ per operating system, kept apart so they can be checked"

[dependencies]
# Deliberately thin. This crate exists so that `cargo check -p fury-platform
# --target x86_64-pc-windows-msvc` runs on a developer's Mac, and that is only
# true while nothing here pulls a dependency with a build script that needs a
# Windows C toolchain. `ring` is the one that bites: the agent depends on it
# through sqlx and reqwest, which is why checking the agent for Windows fails
# on this machine and checking this crate does not.
#
# Before adding a dependency here, run:
#     cargo check -p fury-platform --target x86_64-pc-windows-msvc
# If it stops working, the dependency does not belong in this crate.
tokio = { workspace = true }
# Pure Rust, no build script — checked against the rule above and it holds.
# Used only for the installation tag; see dirs::short_tag for why it is not
# DefaultHasher.
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Every feature this crate needs is named here even when tokio happens to
# enable the same one. Cargo unions features across the graph, so relying on a
# dependency's list means a tokio release that drops one breaks this build with
# an error that points at our code and mentions nothing about tokio.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
